<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Receipt Price Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        display: block;
      }

      /* หน้าจอแจ้งเตือนให้หมุนโทรศัพท์เป็นแนวตั้ง */
      #rotate-warning {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(20, 20, 20, 0.96);
        color: #ffffff;
        z-index: 999999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .phone-icon {
        width: 60px;
        height: 90px;
        border: 3px solid #4CAF50;
        border-radius: 12px;
        margin-bottom: 24px;
        position: relative;
        animation: rotatePhone 2s ease-in-out infinite alternate;
      }

      .phone-icon::after {
        content: '';
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #4CAF50;
      }

      @keyframes rotatePhone {
        0% {
          transform: rotate(90deg);
        }
        50%, 100% {
          transform: rotate(0deg);
        }
      }

      #rotate-warning h2 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px 0;
        color: #ffffff;
      }

      #rotate-warning p {
        font-size: 14px;
        color: #aaaaaa;
        margin: 0;
      }

      /* แสดงหน้าต่างแจ้งเตือนเมื่อถือหน้าจอเป็นแนวนอนบนมือถือ/แท็บเล็ต */
      @media screen and (orientation: landscape) and (max-height: 650px) {
        #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    </div>

    <!-- กล่องแจ้งเตือนหมุนแนวตั้ง -->
    <div id="rotate-warning">
      <div class="phone-icon"></div>
      <h2>กรุณาหมุนโทรศัพท์เป็นแนวตั้ง</h2>
      <p>(Please rotate your device to portrait mode)</p>
    </div>

    <script src="Build/Reciept_game.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warning = document.querySelector("#rotate-warning");

      function checkOrientation() {
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var isLandscape = window.innerWidth > window.innerHeight;
          if (isLandscape && window.innerHeight <= 650) {
            warning.style.display = "flex";
          } else {
            warning.style.display = "none";
          }
        }
      }

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
      checkOrientation();

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/Reciept_game.data.unityweb",
        frameworkUrl: "Build/Reciept_game.framework.js.unityweb",
        codeUrl: "Build/Reciept_game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Dementia_phase3",
        productVersion: "0.1.0",
      });
    </script>
  </body>
</html>
